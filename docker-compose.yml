services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: driftwatch
      POSTGRES_PASSWORD: driftwatch
      POSTGRES_DB: driftwatch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftwatch -d driftwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
