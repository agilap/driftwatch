services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: driftwatch
      POSTGRES_PASSWORD: driftwatch
      POSTGRES_DB: driftwatch
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftwatch -d driftwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://driftwatch:driftwatch@db:5432/driftwatch
      SECRET_KEY: ${SECRET_KEY:-local-development-only}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      REPORT_SCHEDULE_CRON: ${REPORT_SCHEDULE_CRON:-0 0 * * 1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PSI_YELLOW_THRESHOLD: ${PSI_YELLOW_THRESHOLD:-0.10}
      PSI_RED_THRESHOLD: ${PSI_RED_THRESHOLD:-0.20}
      KS_PVALUE_THRESHOLD: ${KS_PVALUE_THRESHOLD:-0.05}
      MIN_SAMPLE_WARNING: ${MIN_SAMPLE_WARNING:-30}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=6)"]
      interval: 10s
      timeout: 7s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
